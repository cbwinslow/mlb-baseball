# CodeRabbit is an ADVISORY reviewer here (openspec/project.md: Kilo Code is
# the kept AI reviewer; `test` + `secrets` are the only merge gates). This
# config dials it down from its default ASSERTIVE profile, which generated
# MD001 heading nits, "hyphenate the compound modifier", and LanguageTool
# grammar on doc-heavy PRs -- repeatedly declined by the maintainer.
# Ref: https://docs.coderabbit.ai/getting-started/configure-coderabbit
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false
  auto_review:
    enabled: true
    drafts: false
  # Prose-heavy trees: no value in line-by-line review.
  path_filters:
    - "!docs/**"
    - "!openspec/**"
    - "!**/*.md"
  tools:
    languagetool:
      enabled: false
    markdownlint:
      enabled: false
