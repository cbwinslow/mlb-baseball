# CI: lint, type-check, and run the full test suite on every push/PR to main.
#
# Three jobs run in parallel instead of one linear job, so a trivial lint
# error gets feedback in well under a minute instead of waiting behind the
# full ~5-6 minute test run:
#   - lint: ruff, sqlfluff, mypy -- fast, no services needed.
#   - unit: tests/unit -- fast, no services needed.
#   - integration: tests/integration -- needs the Postgres service container
#     and the Chadwick build, so it's the slow one.
#
# Integration tests run against a real Postgres service container (mlb_test),
# matching the project's "mock the network, never the database" testing rule
# (CLAUDE.md / README "Testing"). The Chadwick CLI tools (cwevent/cwgame/cwbox)
# are built from source so the retrosheet_event/retrosheet_box tests actually
# run instead of skipping — the build is ~a minute and cached by release tag.
#
# Uses `uv sync --frozen` + `uv run` throughout, not pip, per the committed
# uv.lock and docs/PROJECT_REVIEW.md's "standardize uv sync/uv run as the
# only documented local and CI path" recommendation -- also a hard
# requirement now, not just a style preference: the integration suite
# includes a real subprocess call to `uv run` (test_sqlmesh_candidate_gate.py,
# the Plan 02 SQLMesh parity gate), so `uv` must be on PATH for tests to pass
# at all. Its earlier absence from this file is why CI was silently red on
# every push from 2026-08-07 through 2026-08-13 (27 commits) -- one test
# failing with "FileNotFoundError: 'uv'", unnoticed the whole time.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a still-running run for the same branch/PR once a newer commit lands,
# instead of letting both finish -- saves Actions minutes and gets feedback
# on the latest push faster.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job below needs to write to the repo; default (write-all-ish) permissions
# are narrowed to read-only at the workflow level. The secrets job further
# narrows to contents: read explicitly for clarity.
permissions:
  contents: read

# Chadwick is pinned to a git commit, not the v0.10.0 release tarball: the
# release's cwevent rejects the full field spec chadwick_tools.py requests
# ("Invalid field spec") — the extended field range grew after the release,
# and local installs are built from git. Bump the SHA deliberately.
env:
  CHADWICK_REF: baa7c4b3e89cf2c9871a9f7f853f6980b4226af7

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed files for credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install package with dev dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Lint (sqlfluff, mlb_baseball/sql/)
        run: uv run sqlfluff lint mlb_baseball/sql/

      - name: Lint (SQL ownership -- inline SQL that should be a named resource)
        run: uv run python scripts/lint_sql_ownership.py

      - name: Type-check (mypy)
        run: uv run mypy

  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install package with dev dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        run: uv run pytest tests/unit -q --cov=mlb_baseball --cov-report=xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mlb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install package with dev dependencies
        run: uv sync --frozen --extra dev

      - name: Configure the Postgres service (pg_stat_statements + throwaway-DB durability)
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          # The CI Postgres is a disposable container that is destroyed after
          # the run -- crash-safety buys nothing here, and the fsync/WAL cost
          # dominates a suite that creates ~hundreds of templated databases.
          # Same relaxations tests/conftest.py already applies per-database
          # (issue #2), lifted to the whole cluster. Do NOT copy these to any
          # persistent database.
          # `-i` is required: without it `docker exec` does not forward the
          # heredoc on stdin, so psql would get EOF and silently run nothing.
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements';
          ALTER SYSTEM SET fsync = off;
          ALTER SYSTEM SET synchronous_commit = off;
          ALTER SYSTEM SET full_page_writes = off;
          ALTER SYSTEM SET max_wal_senders = 0;
          ALTER SYSTEM SET wal_level = minimal;
          SQL
          docker restart "$POSTGRES_CONTAINER_ID"
          until docker exec "$POSTGRES_CONTAINER_ID" pg_isready -U postgres; do sleep 1; done

      - name: Install pgTAP in the PostgreSQL service and runner
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec --user root "$POSTGRES_CONTAINER_ID" apt-get update -q
          docker exec --user root "$POSTGRES_CONTAINER_ID" apt-get install -y -q postgresql-16-pgtap
          sudo apt-get update -q
          sudo apt-get install -y -q libtap-parser-sourcehandler-pgtap-perl

      - name: Run pgTAP database contracts
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlb_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlb_test
        run: |
          uv run mlb migrate
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgtap"
          pg_prove --dbname="$TEST_DATABASE_URL" --verbose tests/pgtap/*.pg

      - name: Cache Chadwick tools build
        id: chadwick-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/chadwick-install
          key: chadwick-${{ env.CHADWICK_REF }}

      - name: Build Chadwick tools (cwevent/cwgame/cwbox)
        if: steps.chadwick-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -q autoconf automake libtool
          git clone https://github.com/chadwickbureau/chadwick.git
          cd chadwick
          git checkout "$CHADWICK_REF"
          autoreconf -i
          ./configure --prefix="$HOME/chadwick-install"
          make -j2
          make install

      - name: Install Chadwick tools onto PATH
        run: |
          echo "$HOME/chadwick-install/bin" >> "$GITHUB_PATH"

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlb_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlb_test
        run: uv run pytest tests/integration -q --cov=mlb_baseball --cov-report=xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: integration
          fail_ci_if_error: false

  # Branch protection on main requires a check named "test". This workflow's
  # jobs are named unit/integration; without this aggregator, green PRs stay
  # BLOCKED (PR #90, 2026-08-28). `if: always()` so a failed child still runs
  # this job and fails the required check instead of skipping it.
  test:
    name: test
    needs: [unit, integration]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require unit and integration to have succeeded
        run: |
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.integration.result }}" = "success"
