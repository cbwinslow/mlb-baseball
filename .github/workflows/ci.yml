# CI: lint, type-check, and run the full test suite on every push/PR to main.
#
# Integration tests run against a real Postgres service container (mlb_test),
# matching the project's "mock the network, never the database" testing rule
# (CLAUDE.md / README "Testing"). The Chadwick CLI tools (cwevent/cwgame/cwbox)
# are built from source so the retrosheet_event/retrosheet_box tests actually
# run instead of skipping — the build is ~a minute and cached by release tag.
#
# Uses `uv sync --frozen` + `uv run` throughout, not pip, per the committed
# uv.lock and docs/PROJECT_REVIEW.md's "standardize uv sync/uv run as the
# only documented local and CI path" recommendation -- also a hard
# requirement now, not just a style preference: the integration suite
# includes a real subprocess call to `uv run` (test_sqlmesh_candidate_gate.py,
# the Plan 02 SQLMesh parity gate), so `uv` must be on PATH for tests to pass
# at all. Its earlier absence from this file is why CI was silently red on
# every push from 2026-08-07 through 2026-08-13 (27 commits) -- one test
# failing with "FileNotFoundError: 'uv'", unnoticed the whole time.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Chadwick is pinned to a git commit, not the v0.10.0 release tarball: the
# release's cwevent rejects the full field spec chadwick_tools.py requests
# ("Invalid field spec") — the extended field range grew after the release,
# and local installs are built from git. Bump the SHA deliberately.
env:
  CHADWICK_REF: baa7c4b3e89cf2c9871a9f7f853f6980b4226af7

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed files for credentials
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mlb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install package with dev dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Lint (sqlfluff, mlb_baseball/sql/)
        run: uv run sqlfluff lint mlb_baseball/sql/

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Enable pg_stat_statements in the Postgres service
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c \
            "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U postgres; do sleep 1; done

      - name: Cache Chadwick tools build
        id: chadwick-cache
        uses: actions/cache@v4
        with:
          path: ~/chadwick-install
          key: chadwick-${{ env.CHADWICK_REF }}

      - name: Build Chadwick tools (cwevent/cwgame/cwbox)
        if: steps.chadwick-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -q autoconf automake libtool
          git clone https://github.com/chadwickbureau/chadwick.git
          cd chadwick
          git checkout "$CHADWICK_REF"
          autoreconf -i
          ./configure --prefix="$HOME/chadwick-install"
          make -j2
          make install

      - name: Install Chadwick tools onto PATH
        run: |
          echo "$HOME/chadwick-install/bin" >> "$GITHUB_PATH"

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlb_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlb_test
        run: uv run pytest -q
