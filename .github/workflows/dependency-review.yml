# Blocks a PR that introduces a dependency with a known vulnerability or an
# incompatible license, with the finding posted as a PR comment only when
# there is a finding (on-failure) -- `always` posted an empty "nothing found"
# comment on nearly every PR. Only meaningful on pull_request (it diffs
# against the base branch).
name: dependency-review

on:
  pull_request:
    branches: [main]

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
