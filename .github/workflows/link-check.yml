# Catches dead links across the docs tree (large, growing, easy to let rot).
#
#   - pull_request: internal links only (--offline), advisory (fail: false) --
#     fast, deterministic, catches a PR that moves or renames a doc. This is
#     the case the weekly run used to miss (e.g. the 2026-09-02 archive move).
#   - weekly: the full check including external URLs, fail: true -- external
#     rot is not a given PR's fault, so it stays off the PR path.
name: link-check

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch: {}

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Internal links (pull_request -- advisory)
        if: github.event_name == 'pull_request'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --offline
            --exclude-mail
            'docs/**/*.md'
            'openspec/**/*.md'
            '*.md'
          fail: false

      - name: All links (weekly -- blocking its own run)
        if: github.event_name != 'pull_request'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --exclude-mail
            'docs/**/*.md'
            'openspec/**/*.md'
            '*.md'
          fail: true
