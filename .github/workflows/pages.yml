# Builds the MkDocs Material docs site (mkdocs-docs-site change) and publishes
# it to GitHub Pages. Source lives in docs/site-src/ (including the DuckDB-WASM
# query page, carried through verbatim); `mkdocs build` writes docs/site/, which
# is git-ignored and produced fresh here. One workflow, one Pages site -- the
# $0-hosting rule still holds: GitHub Pages hosting, static output, no server.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site-src/**"
      # Included into the site from outside docs/site-src/ via pymdownx.snippets
      # (the data-dictionary page) -- a change here must redeploy Pages.
      - "docs/DATA_DICTIONARY.md"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

# Only one Pages deployment at a time; a newer push supersedes an
# in-flight one rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install the docs toolchain
        run: uv sync --frozen --extra docs

      - name: Build the site (strict -- a broken link or missing snippet fails)
        run: uv run mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the built site as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
