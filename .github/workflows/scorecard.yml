# Weekly OpenSSF Scorecard supply-chain security assessment. Runs read-only,
# uploads results to the Security tab as SARIF. publish_results is left off
# (no SCORECARD_TOKEN configured) so nothing here needs a manual secret setup
# to be useful -- flip it on later if a public badge is wanted.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 3"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: read
      pull-requests: read
      checks: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
          category: scorecard
