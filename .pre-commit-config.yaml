# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep the hook aligned with the version resolved from this project's
    # development dependencies, so contributors and CI enforce the same rules.
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.1.1
    hooks:
      - id: sqlfluff-lint
        files: ^mlb_baseball/sql/
        additional_dependencies: ['sqlfluff-templater-dbt']

  # Blocks known credential patterns before they enter a commit. GitHub secret
  # scanning and push protection remain the server-side backstop.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

# Config for the pre-commit.ci hosted bot (https://pre-commit.ci): runs these
# hooks on every PR and pushes an autofix commit for anything --fix/format can
# resolve, which helps fork contributors who haven't run `pre-commit install`
# locally. Two hooks are skipped there:
#   - gitleaks: a compiled Go binary, which pre-commit.ci's hook sandbox
#     doesn't build. ci.yml's separate `secrets` job already runs gitleaks on
#     every push/PR regardless.
#   - sqlfluff-lint: its environment (sqlfluff + sqlfluff-templater-dbt) is
#     287.5MiB, over pre-commit.ci's free-tier 250MiB build cap -- confirmed
#     by an actual failed build, not a guess. ci.yml's `test` job already runs
#     `sqlfluff lint` on every push/PR regardless.
ci:
  autofix_commit_msg: "[pre-commit.ci] auto fixes from pre-commit hooks"
  autoupdate_schedule: monthly
  skip: [gitleaks, sqlfluff-lint]
