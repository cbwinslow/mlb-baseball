# Gaps the owner knows about and accepts, so a nightly check does not alert on them.
# One entry per accepted gap. `group` is the line label in `mlb coverage` (a season, a
# referencing column, ...); leave it out to accept the whole table. `max_missing` is a
# ceiling: more than that is a new gap and is reported. Every entry needs a reason and
# the OpenSpec change that owns the decision. Do not add a gap here to make a check green;
# a real defect is repaired, not accepted.

