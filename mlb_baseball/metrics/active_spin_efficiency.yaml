name: active_spin_efficiency
definition: >
  A standalone calculator (run via `mlb active-spin` on the command line)
  that reports a pitch's active spin percentage, gyro angle, and an invented
  composite "ASMI" score from a hand-typed total spin rate and an
  already-known active spin rate. It does not compute active spin from a
  pitch's own measured movement -- hand-typed observed vertical/horizontal
  break inputs are accepted but never used in the calculation -- and it does
  not read any of this project's own ingested Statcast spin data.
formula: mlb_baseball/model/active_spin.py::PitcherActiveSpinEngine.evaluate_active_spin
citation: project-derived (active_spin_pct = active_rpm / total_rpm and
  gyro_angle = arccos(active_ratio) match Baseball Savant's published Active
  Spin / gyro-degree concepts in form, but Baseball Savant computes active
  spin by comparing a pitch's actually observed movement to the movement its
  total spin would produce if it were 100% transverse -- this module instead
  requires the active-spin RPM to already be supplied as an input, so it
  does not perform that inference; the "ASMI" score and its benchmarks are
  this project's own invention, not a published Baseball Savant or Statcast
  metric)
data_source: none -- takes only CLI-supplied numbers (mlb_baseball/cli.py
  "active-spin" command), never reads gold/core/raw
grain: not applicable (stateless per-call calculation, no stored grain)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  RED FLAG -- a concrete gap between the module's stated purpose and what
  the code does, verified by direct read of evaluate_active_spin() and its
  own test (tests/unit/test_active_spin.py). The docstring promises "Hawkeye
  spin decomposition" from observed movement, and
  PitcherActiveSpinMetrics.observed_ivb_in / observed_hb_in are real inputs
  on the dataclass and the CLI (`--ivb`/`--hb`) -- but evaluate_active_spin()
  never reads them; active_spin_pct is computed purely as
  inferred_active_spin_rpm / total_spin_rpm, where inferred_active_spin_rpm
  is itself a separate hand-typed CLI number (`--active`), not derived from
  the movement inputs at all. In other words, the module requires the caller
  to already know the answer (the active-spin RPM) before it can report the
  active-spin percentage; it does not decompose spin from observed movement
  the way its own docstring, and Baseball Savant's real methodology, claim.

  gyro_angle = arccos(active_ratio) is a reasonable formalization of "gyro
  degree" given an active-spin ratio, consistent with the general published
  relationship (Baseball Savant's Spin glossary describes gyro spin as the
  spin component that contributes zero movement). The ASMI ("Active Spin
  Magnus Index") score is entirely this project's own invention -- uncited
  85.0% / 2250 rpm benchmarks and 1.8/2.5 per-unit weights -- and the name
  does not correspond to any real published Baseball Savant/FanGraphs
  metric.

  tests/unit/test_active_spin.py exercises two hand-picked archetype
  profiles and asserts they land in the expected tier -- self-consistency
  with the code's own thresholds/constants, not any comparison to real
  observed pitch movement or an independently published active-spin value.

  `status: implemented-untested` and `visibility: internal` reflect this
  honestly; the observed_ivb_in/observed_hb_in-never-used gap between the
  module's claim and its formula is exactly the kind of code-behavior-vs-
  claim mismatch this catalog effort exists to surface.
