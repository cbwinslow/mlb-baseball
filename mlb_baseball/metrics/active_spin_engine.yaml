name: active_spin_engine
definition: >
  A standalone calculator for active-spin percentage, gyro angle, and an
  "Active Spin Magnus Index" from caller-provided spin-rate inputs.
formula: mlb_baseball/model/active_spin.py::PitcherActiveSpinEngine.evaluate_active_spin
citation: project-derived (no source for ASMI weights or tier cutoffs)
data_source: none -- caller-supplied dataclass fields; no gold/core/raw read
grain: not applicable (stateless per-call calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The active-spin ratio and arccos gyro-angle transformation are recognizable
  baseball concepts, but this module supplies neither a source nor a data
  pipeline for its ASMI coefficients, thresholds, or inferred active-spin
  input. observed_ivb_in and observed_hb_in are accepted but unused.
