name: aging_projection_engine
definition: >
  A standalone three-year player projection calculator that applies fixed
  age-band deltas to velocity, sprint speed, and wOBA or FIP supplied by the
  caller.
formula: mlb_baseball/model/aging.py::SkillAgingProjectionEngine.project_multi_year_trajectory
citation: project-derived (no source for age-band deltas or projection weights)
data_source: none -- caller-supplied dataclass fields; no gold/core/raw read
grain: not applicable (stateless per-player projection)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The tests confirm its chosen monotonic behavior, not a fit or tie-out to
  historical aging data. The fixed annual deltas are hand-authored constants,
  so this is not a published aging curve.
