name: air_trap_engine
definition: >
  A standalone calculator that turns caller-provided pull-fly-ball, warning
  track, and fence-clearance percentages into a custom air-contact score and
  estimated run value.
formula: mlb_baseball/model/air_trap.py::BatterAirTrapEngine.evaluate_air_trap
citation: project-derived (no source for PACDTR/BAPR-style coefficients or tiers)
data_source: none -- caller-supplied dataclass fields; no gold/core/raw read
grain: not applicable (stateless per-call calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The module does not obtain batted-ball measurements itself. Its 18%, 22%,
  32%, 1.25-run, and tier constants are not externally cited.
