name: babip_luck_scanner
definition: >
  Compares a real batter's real actual BABIP (batting average on balls in
  play) to a real expected BABIP -- the mean of Statcast's own published xBA
  model over that batter's own non-home-run balls in play -- for a
  caller-specified date range, via `mlb babip --batter`, then classifies the
  gap into a regression tier (e.g. "SEVERE_POSITIVE_REGRESSION", "buy-low
  candidate"). A separate hand-typed what-if calculator (the pre-fix `mlb
  babip` behavior, an uncited linear formula over caller-typed rate inputs)
  remains available for scouting-input use only.
formula: mlb_baseball/model/babip.py::babip_from_statcast
citation: >
  Real path: Statcast's Expected Statistics methodology (estimated_ba_using_
  speedangle, the same xBA model `model/statcast_expected.py` already
  cites), applied to actual BABIP's standard public definition
  (H - HR) / (AB - K - HR + SF). What-if path: project-derived (no external
  formula cited) -- unchanged from before this fix.
data_source: >
  raw.statcast_pitch (batter, events, bb_type, estimated_ba_using_speedangle;
  populated 2015-present) for the real path; none -- CLI-supplied numbers
  only for the what-if path
grain: per batter, per caller-specified date range (real path); stateless per-call (what-if path)
layer: model
complexity: arithmetic
implementation: python
status: published
visibility: public
notes: >
  Fixed 2026-09-23 (metric-catalog triage follow-up): the module used to be
  a standalone CLI what-if calculator only, with an uncited linear xBABIP
  formula and no real data read. `babip_from_statcast()` now computes both
  actual and expected BABIP from a real batter's real
  `raw.statcast_pitch` rows. Confirmed directly against production:
  `babip_value` is itself a real Statcast-native 0/1 "counts as a BABIP
  hit" flag (1 on single/double/triple, 0 on outs/strikeouts, 0 on home
  runs), independently confirming the hit classification used here;
  `estimated_ba_using_speedangle` coverage on real batted balls is ~91% (2023
  spot check), not 100%. `status: published` reflects the real citation; not
  `validated` because no independent tie-out against a specific known
  published batter value was run this pass. The uncited linear formula
  (0.220 + 0.380*LD% + 0.120*HardHit% + 0.006*(SprintSpeed_fps-27.0) -
  0.140*IFFB% + 0.040*GB%) and its regression-tier cutoffs remain on the
  hand-typed what-if path only (`BABIPRegressionEngine.evaluate_babip`, same
  file), now explicitly labeled as such (`data_source: hand_typed_whatif` on
  its result) rather than presented as a real player's data.
