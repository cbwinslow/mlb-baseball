name: ballpark_carry_scanner_engine
definition: >
  A standalone calculator that checks whether a caller-provided batted-ball
  trajectory (exit velocity, launch angle, spray angle, nominal carry
  distance) would clear the outfield fence at each of all 30 current MLB
  stadium profiles (fence distances and wall heights by field, plus an
  elevation carry boost for Coors Field), reporting an "X/30 ballparks"
  home-run percentage.
formula: mlb_baseball/model/carry.py::BallparkCarryScannerEngine.scan_ballparks
citation: >
  Stadium fence distances per Legion Report's 2026 all-30-park table
  (https://legionreport.com/mlb-stadium-capacity/), cross-checked against
  Wikipedia's per-park center-field figures; Kauffman Stadium reflects the
  Royals' 2026 fence relocation per contemporaneous reporting (see the
  module docstring for the full sourcing note and the specific Fenway/
  Oracle Park corrections made against that table). The linear left-field/
  right-field-to-center-field fence-distance and wall-height interpolation
  by spray angle, the base 4ft clearance-margin requirement, its
  per-foot-of-above-standard-wall-height scaling, and the Coors Field
  elevation boost (16.0 ft) remain project-derived, not sourced from a
  cited external carry/physics model.
data_source: none -- caller-supplied dataclass fields; MLB_STADIUM_PROFILES is a hardcoded in-module list, not gold/core/raw
grain: not applicable (stateless per-call calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Both discrepancies filed in issue #220 (found during metric-catalog
  triage) are now fixed (2026-09-19):

  1. MLB_STADIUM_PROFILES now lists all 30 current MLB venues (was 8,
  labeled "a representative sample"); `total = len(MLB_STADIUM_PROFILES)`
  is now genuinely 30, matching the module's own "X/30 Ballparks" naming.

  2. `scan_ballparks()`'s clearance check now reads `lf_wall_h`/`rf_wall_h`
  via a new `_estimate_wall_height()` (same LF/CF/RF spray-angle
  interpolation as the existing fence-distance estimate, standard-8ft CF
  wall assumed at every park): the required clearance margin is
  `4.0 + max(0.0, wall_height - 8.0)`, so a fly ball that would clear a
  standard fence by the old flat 4ft margin can now be correctly ruled an
  out at a tall-walled park (Fenway's 37ft Green Monster, Daikin Park's
  ~19ft Crawford Boxes, Oracle Park's 24ft RF wall, PNC Park's 21ft
  Clemente Wall) -- see `tests/unit/test_carry.py`'s Green Monster
  regression pair.

  Remaining known limitation, not part of issue #220: the clearance model
  is still a flat distance-plus-margin heuristic, not a real height-at-
  the-fence trajectory calculation (no batted-ball launch physics/drag
  model) -- it uses wall height as an added distance requirement, not an
  actual height comparison. This keeps the fix proportionate to the filed
  bug (wall height data was being ignored entirely) without rewriting the
  module's whole clearance model into a project-derived physics engine
  that a real cited source doesn't back either.
