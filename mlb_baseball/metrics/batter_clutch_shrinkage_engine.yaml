name: batter_clutch_shrinkage_engine
definition: >
  A standalone calculator for a batter's "true-talent" high-leverage
  performance: Empirical Bayes shrinkage of observed high-leverage
  (LI>=1.50) wOBA toward the batter's overall wOBA (M=600 PA), plus a
  sabermetric clutch index (WPA/pLI minus an estimated context-neutral
  WPA) and a three-tier clutch classification.
formula: mlb_baseball/model/clutch.py::BatterClutchEngine.evaluate_clutch
citation: >
  project-derived. The sabermetric Clutch stat concept (WPA / pLI minus
  context-neutral wins, Tom Tango) and Empirical Bayes shrinkage are
  real, general techniques, but this module's context-neutral-WPA
  approximation ((wOBA-0.315)*5.0) and its clutch-tier cutoffs
  (+/-0.010 wOBA delta, +/-1.20 clutch index) are not sourced from a
  cited external formula.
data_source: none -- caller-supplied dataclass fields; no gold/core/raw read
grain: not applicable (stateless per-call calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Same "real general technique, invented project-specific constants"
  shape as batter_platoon_shrinkage_engine (batch 6) and
  bvp_arsenal_interaction_engine (this batch). The underlying Tango
  Clutch formula itself (WPA/pLI - contextNeutralWPA) is real and
  citable; this module's own approximation of contextNeutralWPA is not.
