name: breaking_ball_chase_recognition_engine
definition: >
  A standalone calculator for a batter's breaking-ball chase discipline: a
  Breaking Ball Chase Recognition Index (BBCRI) and estimated offensive
  run value (CDRA), from caller-provided out-of-zone breaking-ball chase
  rate, correct-take rate, and whiff-on-chase rate.
formula: mlb_baseball/model/chase_recog.py::BatterChaseRecogEngine.evaluate_chase_recog
citation: >
  project-derived. No citation is given for the BBCRI benchmark constants
  (32.0% chase, 68.0% take, 58.0% whiff), the per-point bonus
  coefficients (2.2/1.6/0.8), or the 0.0022-runs-per-pitch-per-index-point
  conversion factor.
data_source: none -- caller-supplied dataclass fields; no gold/core/raw read
grain: not applicable (stateless per-call calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Same "standalone caller-input engine" shape as the rest of this batch.
