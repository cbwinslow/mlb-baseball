name: bullpen_workload_hierarchy_engine
definition: >
  A standalone calculator (run via `mlb bullpen` on the command line) that
  scores individual relievers' fatigue and availability (Fresh/Fatigued/
  Unavailable) from a 3-day weighted recent-pitch-count formula, then rolls
  those up into a team's composite bullpen fatigue score and expected FIP
  for the day. It does not read any of this project's own workload or
  performance data, and is not part of any database build.
formula: mlb_baseball/model/reliever.py::BullpenWorkloadHierarchyEngine.evaluate_bullpen
citation: project-derived (no external formula cited)
data_source: none -- CLI command does not even accept real per-reliever workload input; see notes
grain: not applicable (stateless per-call calculation, no stored grain)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  FLAGGED FOR TRIAGE, arguably worse than the already-flagged
  bullpen_leverage_volatility_engine. The fatigue formula itself --
  `1.0*pitches_yesterday + 0.5*pitches_2d_ago + 0.25*pitches_3d_ago` plus a
  hardcoded +10 "back-to-back" bonus, thresholds at 45/25 for
  Unavailable/Fatigued, and fixed FIP/K% penalties (+1.25 FIP & x0.75 K% when
  unavailable; +0.45 FIP & x0.90 K% when fatigued) -- carries no citation to
  any published source and no derivation from this project's own workload
  data (checked docs/RESEARCH.md and docs/DECISIONS.md: ADR-138 documents
  the same constants as "Mathematical Formulations" with zero Citations
  section, same pattern as aging.py's ADR-145).

  Worse than the CLI-input leverage/shift/aging engines: `mlb bullpen --team
  LAD` in cli.py (around line 4812) does not even read per-reliever workload
  from the user -- it builds three fully hardcoded `RelieverProfile` sample
  arms ("Ace Closer", "Primary Setup", "High Lev Arm" with fixed pitch
  counts) regardless of which `--team` was passed, runs the engine against
  that fixture data, and prints the result as if it were real. This is
  effectively demo output dressed as a live command.

  tests/unit/test_reliever.py exercises the formula directly (not through
  the CLI) with hand-picked pitch counts and checks the resulting status/FIP
  moves in the expected direction -- self-consistency of the invented
  formula, not a tie-out against any independently published fatigue/
  workload model, and it does not touch the CLI's hardcoded-sample-data
  problem at all.

  `status: implemented-untested` and `visibility: internal` reflect this
  honestly. Recommended follow-up: either wire `mlb bullpen` to real
  ingested workload data (pitch counts by date are available via
  raw.statcast_pitch) and cite a real workload/fatigue methodology, or
  archive; out of scope for this batch to decide.
