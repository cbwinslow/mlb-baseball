name: bunt_charge_defense_engine
definition: >
  A standalone calculator for infield bunt-charge defense: an Infield Bunt
  Charge Defense Index (IBCDI) from caller-provided charge sprint speed,
  barehand transfer time, and bunt-out conversion rate, plus Bunt Outs
  Above Average (BOAA) and a defensive-run-value estimate.
formula: mlb_baseball/model/bunt_charge.py::InfieldBuntChargeEngine.evaluate_bunt_charge
citation: >
  project-derived. No citation is given for the IBCDI benchmark constants
  (74.0% conversion, 24.0 ft/s speed, 0.58s barehand transfer), the
  per-unit bonus coefficients (2.2/3.0/55.0), or the ~0.42 runs-per-bunt-
  out-secured conversion factor.
data_source: none -- caller-supplied dataclass fields; no gold/core/raw read
grain: not applicable (stateless per-call calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Same "standalone caller-input engine" shape as the rest of this batch.
