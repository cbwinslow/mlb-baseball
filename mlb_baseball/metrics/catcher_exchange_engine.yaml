name: catcher_exchange_engine
definition: >
  A standalone calculator for catcher glove-to-hand exchange speed: total
  pop time (exchange + throw flight), a Catcher Exchange Velocity Index
  (CEVI), and stolen-base-deterrence run savings, from caller-provided
  exchange time, throw velocity, flight time, and accuracy.
formula: mlb_baseball/model/catch_xchg.py::CatcherExchangeEngine.evaluate_exchange
citation: >
  project-derived. No citation is given for the CEVI benchmark constants
  (0.70s transfer, 81.5mph, 65.0% accuracy), the per-unit bonus
  coefficients (160.0/1.8/0.9), or the stolen-base-deterrence run
  coefficients (1.10 runs/second of exchange saved, 0.22 runs per
  accuracy point).
data_source: none -- caller-supplied dataclass fields; no gold/core/raw read
grain: not applicable (stateless per-call calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Same "standalone caller-input engine" shape as the rest of this batch.
