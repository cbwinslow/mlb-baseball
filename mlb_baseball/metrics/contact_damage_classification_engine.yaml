name: contact_damage_classification_engine
definition: >
  A standalone calculator that buckets caller-provided exit-velocity/
  launch-angle batted-ball events into five contact-quality categories
  (Barrel Blast, Solid Contact, Flare/Burner, Popup, Weak Topper), each
  with an assigned run value, then aggregates a damage-rate percentage
  and an expected damage value per batted-ball event.
formula: mlb_baseball/model/damage.py::ContactDamageEngine.evaluate_damage
citation: >
  project-derived. "Barrel" and "Solid Contact" are real Statcast
  terms, but Statcast's actual published Barrel definition uses an
  exit-velocity-dependent launch-angle window that widens as EV
  increases beyond 98mph (e.g. an 8-50 degree window at 116mph), not
  this module's fixed 22-32 degree window at any EV >=98mph. The
  per-category run values (1.40/0.80/0.45/0.02/0.15) are also not
  sourced from a cited external run-value table.
data_source: none -- caller-supplied dataclass fields; no gold/core/raw read
grain: not applicable (stateless per-call calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Uses real Statcast vocabulary but not Statcast's actual Barrel
  definition or run-value table -- stays internal per the citation rule
  until a real tie-out exists.
