name: contact_depth_kinematics_engine
definition: >
  A standalone calculator for batted-ball point-of-impact depth: an
  "optimal" contact depth from pitch velocity/location, a timing margin
  (actual minus optimal depth), a timing-efficiency percentage, and a
  five-tier depth classification, from caller-provided contact depth,
  pitch velocity/location, spray angle, and exit velocity.
formula: mlb_baseball/model/contact_depth.py::ContactDepthEngine.evaluate_contact
citation: >
  project-derived. Contact depth (point of impact relative to the plate)
  is a real, recognizable Statcast/biomechanics concept, but this
  module's specific optimal-depth formula (5.0 + (velo-90)/10*1.5 +
  inside_factor/10*2.0) and timing-efficiency curve (1 -
  (margin/8)^2*0.30) are not sourced from a cited external model.
data_source: none -- caller-supplied dataclass fields; no gold/core/raw read
grain: not applicable (stateless per-call calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Same "standalone caller-input engine" shape as the rest of this batch.
