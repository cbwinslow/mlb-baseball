name: dp_footwork_engine
definition: >
  A standalone calculator for middle-infielder double-play turn
  efficiency: a Double-Play Footwork Turn Index (DPFTI), Double Plays
  Turned Above Average (DPTAA), and a defensive-run-value estimate, from
  caller-provided pivot time, relay throw velocity, and conversion rate.
formula: mlb_baseball/model/dp_footwork.py::InfieldDpFootworkEngine.evaluate_dp_footwork
citation: >
  project-derived. No citation is given for the DPFTI benchmark
  constants (72.0% conversion, 0.74s pivot, 78.0mph throw), the
  per-unit bonus coefficients (2.0/55.0/1.2), or the ~0.45
  runs-per-completed-double-play conversion factor.
data_source: none -- caller-supplied dataclass fields; no gold/core/raw read
grain: not applicable (stateless per-call calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Same "standalone caller-input engine" shape as the rest of this batch.
