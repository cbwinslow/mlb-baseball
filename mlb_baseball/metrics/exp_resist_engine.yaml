name: exp_resist_engine
definition: >
  A standalone two-strike-discipline calculator that turns user-supplied
  two-strike chase rate, out-of-zone contact rate, and foul rate into a
  Two-Strike Expansion Resistance Index (TERI) and an estimated run value
  for prolonging two-strike at-bats.
formula: mlb_baseball/model/exp_resist.py::BatterExpansionResistanceEngine.evaluate_resistance
citation: project-derived (no published source defines a TERI-style composite score)
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-batter calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The chase/O-contact/foul benchmark constants (36.0%/54.0%/40.0%) and their
  point-weightings (2.5/1.8/1.2) are this module's own uncited blend, as is
  the runs-per-TERI-point conversion (0.0035 runs/PA). Two unit tests
  (tests/unit/test_exp_resist.py) confirm the tier thresholds fire on
  hand-picked elite/chase-prone inputs, not against an external benchmark.
