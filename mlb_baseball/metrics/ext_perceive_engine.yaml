name: ext_perceive_engine
definition: >
  A standalone release-extension calculator that turns user-supplied release
  extension distance, radar velocity, and induced vertical break into an
  "effective" (perceived) velocity, an estimated batter reaction-time
  compression, and an Effective Velocity Extension Rating (EVER) score.
formula: mlb_baseball/model/ext_perceive.py::PitcherExtPerceiveEngine.evaluate_extension
citation: >
  project-derived. "Effective velocity" (velocity perceived by the batter
  scaling with release extension) echoes a real, publicly discussed pitching
  concept (Perry Husband's Effective Velocity system), but this module cites
  no source for it, and its specific coefficient (+0.72 mph of effective
  velocity per foot of extension above a 6.0 ft baseline) and its EVER-score
  benchmarks/weights (6.4 ft / 93.5 mph / 16.0 in IVB; 28.0/2.2/1.4 point
  weights) are this project's own uncited choices, not drawn from a
  published formula.
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-pitcher calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Three unit tests (tests/unit/test_ext_perceive.py) confirm the tier
  thresholds fire on hand-picked long/short-extension inputs, not against an
  external benchmark.
