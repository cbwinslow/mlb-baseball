name: first_pitch_ambush_engine
definition: >
  A standalone calculator that combines caller-provided first-pitch swing,
  chase, hard-hit, and slugging rates into a custom ambush score and run value.
formula: mlb_baseball/model/ambush.py::BatterAmbushEngine.evaluate_ambush
citation: project-derived (no source for FPAV/FPSV coefficients or tiers)
data_source: none -- caller-supplied dataclass fields; no gold/core/raw read
grain: not applicable (stateless per-call calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  First-pitch outcomes are meaningful baseball observations, but this module
  neither loads them nor cites its fixed 0.520, 0.12, 0.44, and tier weights.
