name: first_step_burst_engine
definition: >
  A standalone outfielder-jump calculator that turns user-supplied reaction
  time, distance covered in the first 1.5 seconds, and route/jump
  efficiency into a First-Step Reaction Jump Index (FSRJI) and an estimated
  defensive runs-prevented value.
formula: mlb_baseball/model/first_step.py::OutfielderFirstStepEngine.evaluate_first_step
citation: project-derived (no published source defines an FSRJI-style composite)
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-fielder calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The reaction-time/distance/efficiency benchmark constants (0.40s / 32.0 ft
  / 86.0%) and point weights (75.0/3.2/1.4) are this project's own uncited
  blend. Three unit tests (tests/unit/test_first_step.py) confirm the tier
  thresholds fire on hand-picked burster/hesitant inputs, not against an
  external benchmark.
