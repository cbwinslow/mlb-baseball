name: gyro_spin_engine
definition: >
  A standalone pitch-spin-axis calculator that converts user-supplied spin
  efficiency percentage and total spin rate into a gyro degree (angle
  between the spin axis and the direction of Magnus deflection) and its
  active (Magnus-producing) vs gyroscopic (non-deflecting) spin-rate split,
  plus an aerodynamic tier.
formula: mlb_baseball/model/gyro_spin.py::PitchGyroSpinEngine.evaluate_gyro_spin
citation: >
  Spin efficiency and gyro degree are real, publicly documented Statcast/
  Baseball Savant pitch-tracking concepts, and gyro_angle = arccos(spin
  efficiency) is a genuine trigonometric identity relating the two (100%
  efficiency = 0 deg pure transverse/Magnus spin, 0% efficiency = 90 deg
  pure gyro/bullet spin) -- not this project's own invention. Separate from
  the already-cataloged active_spin_efficiency/active_spin_engine
  (model/active_spin.py) and spin_decomposition_engine (model/spin.py),
  which compute related but distinct spin quantities. The aerodynamic-tier
  cutoffs (70/45/25 degrees) are this project's own uncited thresholds on
  top of that real trigonometric relationship.
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-pitch-type calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Three unit tests (tests/unit/test_gyro_spin.py) confirm the arccos
  relationship and tier thresholds fire on hand-picked bullet-slider/
  rising-fastball inputs, not against an external benchmark.
