name: high_heat_elevation_engine
definition: >
  A standalone elevated-fastball calculator that turns user-supplied swing,
  whiff, and hard-hit rates against top-of-zone fastballs into a High-Heat
  Elevation Vulnerability Index (HHEVI) and an estimated runs-produced
  value.
formula: mlb_baseball/model/high_heat.py::BatterHighHeatEngine.evaluate_high_heat
citation: >
  project-derived (no published source defines an HHEVI-style composite).
  Distinct from heat_check_engine (model/heat_check.py), which scores in-
  zone fastballs, not elevated ones.
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-batter calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The whiff/hard-hit/swing benchmark constants (26.0% / 36.0% / 60.0%),
  point weights (2.5/1.8/0.6), and the 0.0022 runs-per-opportunity
  conversion are this project's own uncited blend. Three unit tests
  (tests/unit/test_high_heat.py) cover an elite crusher, a vulnerable
  hitter, and health_check on hand-picked inputs, not an external benchmark.
