name: lead_snap_secondary_lead_engine
definition: >
  A standalone baserunner-lead calculator that turns user-supplied primary
  lead, secondary lead, and pitcher delivery time into an Aggressive
  Secondary Lead Index (ASLI), an extra-base advance probability boost, and
  an estimated baserunning runs value.
formula: mlb_baseball/model/lead_snap.py::RunnerLeadSnapEngine.evaluate_lead_snap
citation: >
  project-derived (no published source defines an ASLI-style composite)
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-runner calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The 20.5 ft / 10.5 ft / 1.35 s benchmarks, point weights (4.2/3.0/25.0),
  the 3.5%-per-foot advance boost and the 0.0018 runs-per-opportunity
  conversion are this project's own uncited choices. pickoff_throw_rate_pct
  is a dataclass field that the calculation never reads. Three unit tests
  (tests/unit/test_lead_snap.py) cover an aggressive runner, a cautious
  runner, and health_check on hand-picked inputs.
