name: lineup_protection_engine
definition: >
  A standalone lineup-protection calculator that turns the on-deck hitter's
  wOBA, the current batter's zone rate and first-pitch-strike rate into a
  Protection Influence Index (PII) and an estimated runs value (LPRV) for
  the on-deck hitter's effect on how pitchers approach the current batter.
formula: mlb_baseball/model/lineup_protect.py::BatterLineupProtectionEngine.evaluate_protection
citation: >
  The module docstring lists references (Tango, Lichtman and Dolphin, The
  Book, 2007, a chapter on protection in the batting order; Lindsey 1963;
  Albert and Bennett, Curve Ball, 2001). Those are real works, but this
  review did not check the specific chapter or find the PII/LPRV formula in
  them, and the constants (0.320 wOBA, 45.0% zone, 60.0% F-strike; weights
  120.0/0.8/0.5; 0.0022 runs per PA) are not sourced to any of them. Treat
  the formula as project-derived. Published lineup-protection research is
  commonly summarized as finding small effects, which this module's large
  effect sizes do not obviously reflect; not verified here.
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-batter calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  intentional_walk_pct feeds only the is_heavily_protected flag. Three unit
  tests (tests/unit/test_lineup_protect.py) cover an elite-protection case,
  an unprotected case, and health_check on hand-picked inputs.
