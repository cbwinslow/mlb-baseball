name: low_scoop_framing_engine
definition: >
  A standalone low-zone framing calculator that turns user-supplied called-
  strike rate on low pitches, upward glove speed, and glove-drop rate into a
  Bottom-Zone Scoop Framing Rating (BZSFR), extra strikes won above a 48%
  benchmark, and an estimated runs-saved value.
formula: mlb_baseball/model/low_scoop.py::CatcherLowScoopEngine.evaluate_low_scoop
citation: >
  project-derived. Framing itself is a real, cited concept elsewhere in this
  catalog (catcher_framing_csae, catcher_framing_prior_season), but this
  module is a separate uncited composite: the 48.0% low-zone benchmark, 3.5
  ft/s scoop speed, point weights (2.2/12.0/1.1) and the 0.125 runs-per-
  strike value are its own choices.
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-catcher calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Three unit tests (tests/unit/test_low_scoop.py) cover an elite lifter, a
  glove-dropping catcher, and health_check on hand-picked inputs, not an
  external framing benchmark.
