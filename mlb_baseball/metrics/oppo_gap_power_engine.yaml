name: oppo_gap_power_engine
definition: >
  A standalone opposite-field power calculator that turns user-supplied
  opposite-field contact rate, hard-hit rate, and extra-base-hit rate into
  an Opposite-Field Gap Power Index (OFGPI) and an estimated runs-produced
  value.
formula: mlb_baseball/model/oppo_gap.py::BatterOppoGapEngine.evaluate_oppo_gap
citation: >
  project-derived (no published source defines an OFGPI-style composite)
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-batter calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The 8.5% XBH / 34.0% hard-hit / 25.0% oppo-contact benchmarks, point
  weights (3.2/1.8/0.8) and the 0.0032 runs conversion are this project's
  own uncited blend. Three unit tests (tests/unit/test_oppo_gap.py) cover a
  power hitter, a pull-dependent slapper, and health_check on hand-picked
  inputs.
