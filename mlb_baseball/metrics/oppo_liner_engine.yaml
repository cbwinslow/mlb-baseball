name: oppo_liner_engine
definition: >
  A standalone opposite-field line-drive calculator that turns user-supplied
  oppo line-drive rate, BABIP on those liners, and hard-hit rate into an
  Opposite Field Line Drive Impact Index (OFLDII) and an estimated runs-
  produced value.
formula: mlb_baseball/model/oppo_liner.py::BatterOppoLinerEngine.evaluate_oppo_liner
citation: >
  project-derived (no published source defines an OFLDII-style composite)
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-batter calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The 20.0% LD / .620 BABIP / 40.0% hard-hit benchmarks, point weights
  (2.0/50.0/1.2) and the 0.0030 runs conversion are this project's own
  uncited blend. Three unit tests (tests/unit/test_oppo_liner.py) cover a
  line-drive artist, a weak-flare hitter, and health_check on hand-picked
  inputs.
