name: outfield_arm_engine
definition: >
  A standalone outfield-arm calculator that estimates throw arrival time,
  runner-hold rate, and seasonal runs from caller-provided velocity and
  exchange time.
formula: mlb_baseball/model/arm.py::OutfieldArmEngine.evaluate_arm
citation: project-derived (no source for hold-probability or run-value constants)
data_source: none -- caller-supplied dataclass fields; no gold/core/raw read
grain: not applicable (stateless per-fielder calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The code uses a custom logistic hold-rate curve and fixed aerodynamic/run
  constants. Unit tests exercise the chosen formula and a tier regression,
  not a Statcast or published-fielding tie-out.
