name: outfield_target_accuracy_engine
definition: >
  A standalone outfield-throwing calculator that turns user-supplied throw
  accuracy, assist conversion, and arm strength into an Outfield Laser
  Target Accuracy Index (OLTAI) and an estimated runs-prevented value.
formula: mlb_baseball/model/outfield_target.py::OutfieldTargetEngine.evaluate_outfield_target
citation: >
  project-derived. Separate from outfield_arm_accuracy_engine and
  outfield_arm_engine (model/arm_accuracy.py, model/arm.py); no published
  source defines an OLTAI-style composite.
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-fielder calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The 65.0% accuracy / 60.0% conversion / 88.0 mph benchmarks, point weights
  (2.2/1.6/1.4) and the 0.0035 runs-per-chance conversion are this project's
  own uncited blend. Three unit tests (tests/unit/test_outfield_target.py)
  cover a cannon sniper, a wild arm, and health_check on hand-picked inputs.
