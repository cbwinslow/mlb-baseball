name: pitch_tunneling_engine
definition: >
  Evaluates a real pitcher's two real pitch types' tunneling (`mlb tunnel
  --pitcher`) using real release/trajectory kinematics from Statcast: how
  similar their flight paths look to a hitter at release and at the real
  Tunnel Point (23.8 ft / 175ms before the plate, Baseball Prospectus's
  published definition), before breaking apart via their real plate-crossing
  positions. A separate hand-typed what-if calculator (the pre-fix `mlb
  tunnel` behavior, hand-entered release/velocity/break numbers and a
  `poc_factor` approximation) remains available for scouting-input use only.
formula: mlb_baseball/model/tunnel.py::tunnel_pair_from_statcast
citation: >
  Real path: tunnel-point definition and Break:Tunnel Ratio from Baseball
  Prospectus, Long/Pavlidis/Judge, "Introducing Pitch Tunnels" (2017);
  tunnel-point trajectory position computed via the same closed-form
  projectile-motion kinematics `model/vaa.py::pitch_vaa_degrees()` already
  uses (real vx0/vy0/vz0/ax/ay/az), not an approximation. The 0-100
  `tunneling_quality_score` scaling, `whiff_boost_pct`, and the elite-tunnel
  thresholds (POC <= 8.5in, plate split >= 16.0in) remain project-derived --
  no published source for those specific numbers was found (literature
  check, 2026-09-23). What-if path: project-derived throughout (no external
  formula cited), unchanged from before this fix.
data_source: >
  raw.statcast_pitch (pitcher, pitch_type, release_pos_x/z, vx0/vy0/vz0,
  ax/ay/az, plate_x/z) for the real path; none -- hand-entered
  PitchFlightVector inputs only for the what-if path
grain: per pitcher, per pitch-type pair, per caller-specified date range (real path); stateless per-pitch-pair (what-if path)
layer: model
complexity: complex
implementation: python
status: published
visibility: public
notes: >
  Fixed 2026-09-23 (metric-catalog triage follow-up): the module used to be
  a standalone CLI what-if calculator only, with an uncited `poc_factor =
  0.30` linear approximation and no real data read. `tunnel_pair_from_
  statcast()` now computes release distance, real Tunnel Point separation
  (exact kinematics, not the approximation), and real plate-break separation
  (from real `plate_x`/`plate_z`) for a real pitcher's real pitches.
  `break_tunnel_ratio` (new field on `PitchTunnelEvaluation`) is BP's
  published Break:Tunnel Ratio -- (plate separation - Tunnel Point
  separation) / Tunnel Point separation. `status: published` reflects that
  citation; not `validated` because no independent tie-out against a
  specific known published pitcher pair's tunnel numbers was run this pass.
  The 0-100 score scaling, whiff-boost formula, and elite-tunnel thresholds
  remain project-derived on both paths (see citation) -- kept separate from
  the cited ratio so no claim implies a citation it does not have. The
  `poc_factor = 0.30` approximation remains on the hand-typed what-if path
  only (`PitchTunnelingEngine.evaluate_tunnel_pair`, same file), now
  explicitly labeled as such (`data_source: hand_typed_whatif` on its
  result) rather than presented as a real pitcher's data.

  `complexity` changed from `arithmetic` to `complex`: the real path solves
  a closed-form kinematics equation (not a deterministic aggregation over
  already-normalized data), matching this catalog's own `complexity`
  definition.
