name: pitcher_workload_fatigue_engine
definition: >
  A standalone calculator (run via `mlb fatigue` on the command line) that
  scores a pitcher's workload strain from an acute-to-chronic pitch-count
  ratio (7-day average vs. 28-day average), plus velocity-decay and
  release-point-drop flags, into a composite 0-100 Fatigue Risk Index and a
  tier (OPTIMAL_FITNESS/MODERATE_FATIGUE/HIGH_FATIGUE_OVERLOAD). Every
  input is typed in by the CLI caller; it does not read any of this
  project's own pitch, appearance, or biomechanical data.
formula: mlb_baseball/model/fatigue.py::PitcherFatigueEngine.evaluate_fatigue
citation: "project-derived (no external formula cited)"
data_source: none -- takes only CLI-supplied numbers (mlb_baseball/cli.py "fatigue" command), never reads gold/core/raw
grain: not applicable (stateless per-call calculation, no stored grain)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Same shape as travel_fatigue_engine and the previously flagged
  bullpen_leverage_volatility_engine (reliever.py): the actual code never
  queries the database (no `conn` parameter anywhere in evaluate_fatigue),
  operates only on a PitcherWorkloadMetrics dataclass populated by hand
  from CLI flags, and `mlb fatigue` is wired into cli.py as a standalone
  command, not into any gold-table build pipeline -- confirmed by grepping
  the repository for PitcherFatigueEngine / evaluate_fatigue / `model.
  fatigue`: the only hits are cli.py, this module, and its own unit test.
  It IS wired into `mlb doctor` (doctor.py calls fatigue.health_check()),
  but that check only runs the engine against two hardcoded synthetic
  inputs ("Rested Ace" / "Overworked Starter") and asserts the same
  deterministic formula still classifies them as expected -- a smoke test
  on the code, not a validation of the fatigue index against any real
  pitcher.

  The Acute:Chronic Workload Ratio (ACWR) structure itself -- 7-day average
  load divided by 28-day average load -- is a real, published sports-
  science concept (originating in team-sport injury-monitoring research,
  e.g. Gabbett, "The training-injury prevention paradox: should athletes be
  training smarter and harder?", British Journal of Sports Medicine, 2016,
  and follow-on work applying rolling acute:chronic ratios to workload/
  injury-risk monitoring). This module's own docstring does not cite that
  or any other source, and applying an ACWR framework developed for
  team-sport running-load monitoring to a pitcher's pitch counts is this
  project's own analogy, not a baseball-specific finding from that
  literature. Beyond the ACWR ratio itself, every other constant in the
  composite Fatigue Risk Index -- the velocity-decay threshold (-1.2 mph),
  release-point-drop threshold (-1.5 in), and the penalty weights
  (acwr_penalty *35.0, velo_penalty *20.0, mech_penalty *6.0,
  stress_penalty *5.0 per high-stress inning) and tier cutoffs (60/35) --
  carries no citation and no derivation from this project's own data.

  `citation: project-derived` reflects that, despite ACWR's real published
  origin, nothing in this specific implementation (the pitching-specific
  thresholds, the composite weighting, the tier cutoffs) is itself drawn
  from a cited source -- it borrows a real concept's name and general shape
  without reproducing a specific published pitching relationship.

  `status: implemented-untested` and `visibility: internal` reflect this
  honestly rather than describing it as a validated or citable statistic.
  Recommended follow-up, out of scope for this batch to decide: confirm
  with the owner whether this should be archived, cite the ACWR literature
  it borrows from if kept, or be wired to real pitch/appearance data
  (fatigue_drop.py, a separate module with its own catalog entry, already
  covers a related velocity/release-point signal from real data and should
  be checked for overlap before any such change).
