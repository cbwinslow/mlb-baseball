name: pivot_dp_turn_engine
definition: >
  A standalone double-play-pivot calculator that turns user-supplied pivot
  turn time, relay throw velocity, and double-play counts into a Double Play
  Turn Index (DPTI), a conversion percentage, and an estimated runs-saved
  value against a 68% conversion baseline.
formula: mlb_baseball/model/pivot_dp.py::InfieldPivotDPEngine.evaluate_pivot
citation: >
  project-derived. Separate from dp_footwork_engine (model/dp_footwork.py).
  The conversion percentage is plain arithmetic (turned / opportunities);
  the DPTI weighting (0.78 s and 82.0 mph benchmarks), the 68.0% baseline
  and the 0.48/0.38 run values are this project's own uncited choices.
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-infielder calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  failed_pivot_turns is a dataclass field that the calculation never reads.
  Three unit tests (tests/unit/test_pivot_dp.py) cover a fast turner, a
  slow-pivot shortstop, and health_check on hand-picked inputs.
