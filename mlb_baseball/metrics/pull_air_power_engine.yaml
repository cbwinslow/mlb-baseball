name: pull_air_power_engine
definition: >
  A standalone pulled-fly-ball/line-drive calculator: the share of a
  batter's fly balls and line drives that are pulled (Pull-Air%), its gap to
  a 28.5% league baseline, and a Pulled-Air Damage Multiplier (PADM) that
  scales by the batter's share of home runs hit while pulling.
formula: mlb_baseball/model/pull_air.py::PullAirPowerEngine.evaluate_pull_air
citation: >
  project-derived. Pull-air% is plain arithmetic (pulled air balls / total
  air balls) and is related to publicly reported Pull% and FB% but is not a
  published leaderboard stat under this name. The 28.5% baseline, the 0.5
  home-run-share weight in PADM and the archetype cutoffs (38.0% / 33.0% /
  22.0%) are this project's own uncited choices.
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-batter calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  An inline code comment in evaluate_pull_air says pulled air balls convert
  exit velocity into home runs about 3x more effectively; that claim is not
  used in the calculation. Three unit tests
  (tests/unit/test_pull_air.py) cover a pull-air slugger, an all-fields
  hitter, and health_check on hand-picked inputs.
