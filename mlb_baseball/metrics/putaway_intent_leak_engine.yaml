name: putaway_intent_leak_engine
definition: >
  A standalone two-strike command calculator that turns user-supplied
  chase/dirt rate, heart-of-the-zone leak rate, and two-strike strikeout
  rate into a Two-Strike Putaway Intent Execution Index (TSPIEI) and an
  estimated runs-prevented value from avoiding heart-zone mistakes.
formula: mlb_baseball/model/intent_leak.py::PitcherIntentLeakEngine.evaluate_intent_leak
citation: >
  project-derived (no published source defines a TSPIEI-style composite).
  Separate from the other two-strike modules still queued (putaway.py,
  putaway_depth.py, putaway_exec.py), which are not yet cataloged.
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-pitcher calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The chase/heart-leak/K% benchmark constants (52.0% / 19.0% / 38.0%), point
  weights (1.8/3.2/1.4), and the 0.28 runs-per-avoided-meatball value are
  this project's own uncited blend. Three unit tests
  (tests/unit/test_intent_leak.py) cover a sniper, a leaker, and
  health_check on hand-picked inputs.
