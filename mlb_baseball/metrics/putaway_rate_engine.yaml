name: putaway_rate_engine
definition: >
  A standalone two-strike put-away calculator: a pitcher's put-away rate
  (share of two-strike pitches ending in a strikeout) against a 19.5% league
  baseline, converted to a surplus-runs value and a finisher tier.
formula: mlb_baseball/model/putaway.py::PitcherPutAwayEngine.evaluate_putaway
citation: >
  Put Away % is, to my knowledge, a publicly reported Statcast pitch-arsenal
  statistic, though this review did not check its exact definition against
  this module's input. The 19.5% baseline, the 0.11 runs-per-strikeout
  swing, and the tier cutoffs (0.240 / 0.210 / 0.165) are this project's own
  uncited choices. Separate from putaway_intent_leak_engine and the two
  other putaway modules.
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-pitcher calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  whiff_2strike_pct and secondary_putaway_pct are dataclass fields the
  calculation never reads, so the docstring's claim of a secondary-pitch
  whiff rate is not implemented; only putaway_pct and two_strike_pitches
  drive the result. Three unit tests (tests/unit/test_putaway.py) cover an
  elite closer, a foul-ball extender, and health_check on hand-picked
  inputs.
