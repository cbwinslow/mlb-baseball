name: putaway_whiff_escalation_engine
definition: >
  A standalone two-strike whiff-escalation calculator that turns user-
  supplied two-strike whiff rate, early-count whiff rate, and two-strike
  chase rate into a Putaway Whiff Escalation Index (PWEI) and an estimated
  surplus-strikeout runs value.
formula: mlb_baseball/model/putaway_depth.py::PitcherPutawayDepthEngine.evaluate_putaway_depth
citation: >
  project-derived (no published source defines a PWEI-style composite)
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-pitcher calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The 38.0% / 10.0-point / 34.0% benchmarks, point weights (1.8/1.4/1.2),
  the 0.60 secondary-pitch share and the 0.28 runs-per-strikeout value are
  this project's own uncited blend. Three unit tests
  (tests/unit/test_putaway_depth.py) cover a lethal executioner, a blunt
  weapon, and health_check on hand-picked inputs.
