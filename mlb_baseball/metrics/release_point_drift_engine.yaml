name: release_point_drift_engine
definition: >
  A standalone release-point consistency calculator: spatial release
  dispersion (the square root of the horizontal and vertical release
  standard deviations squared and summed, in inches) plus late-game release
  drop feed a Mechanical Consistency Score (MCS) and fatigue-collapse flag.
formula: mlb_baseball/model/rel_drift.py::PitcherReleaseDriftEngine.evaluate_release_drift
citation: >
  The dispersion is plain arithmetic (a 2D standard deviation). The MCS
  score, its 2.41 inch benchmark (which is simply this dataclass's own
  default dispersion), the 0.8 inch drop threshold and the 16.0/11.0 point
  weights are this project's own uncited choices.
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-pitcher calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  mean_rel_x_ft, mean_rel_z_ft and pitch_count_evaluated are dataclass
  fields the calculation never reads. Separate from fatigue_drop_engine and
  arm_slot_sag_engine. Four unit tests (tests/unit/test_rel_drift.py) on
  hand-picked inputs.
