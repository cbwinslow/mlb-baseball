name: seam_shifted_wake_engine
definition: >
  A standalone seam-shifted-wake estimator: it subtracts an estimated pure-
  spin (Magnus) break, chosen by pitch type, from the observed vertical and
  horizontal break, and reports the leftover movement as a wake deviation
  with an assumed whiff boost and hard-hit suppression.
formula: mlb_baseball/model/ssw.py::SeamShiftedWakeEngine.evaluate_pitch_ssw
citation: >
  Seam-shifted wake is, to my knowledge, a real and publicly discussed
  pitch-aerodynamics topic (work by Barton Smith and Alan Nathan and
  others), but this review did not verify a specific source for this
  formula. The Magnus baseline here is not a physical calculation: it uses
  hard-coded per-pitch-type amplitudes (for example 16.0 and 14.0 inches for
  fastballs) scaled by spin rate and velocity. The 1.4% whiff and 1.6% hard-
  hit effects per inch, and the 2.0 inch pronounced-SSW cutoff, are uncited.
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-pitch calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Because the baseline is a template, the reported wake is only as good as
  those amplitudes; treat it as illustrative. Separate from
  seam_shifted_wake_latent_engine (model/ssw_latent.py), which takes the
  pure-Magnus break as a caller-supplied input. Three unit tests
  (tests/unit/test_ssw.py) on hand-picked inputs.
