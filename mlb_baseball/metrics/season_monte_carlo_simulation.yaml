name: season_monte_carlo_simulation
definition: >
  Simulates remaining/full 162-game MLB regular-season schedules across
  all 30 teams (via `mlb season-sim`), evaluating tie-breakers, division
  championships, wild-card berths, and the 12-team postseason bracket, to
  produce regular-season win-total distributions.
formula: mlb_baseball/model/season.py::simulate_season_monte_carlo
citation: >
  project-derived orchestration. Two of its component formulas are real
  cited published methods used internally: Bill James' Log5 win
  probability (log5_game_win_prob) and the Pythagorean win-percentage
  expectation with the Smyth-Patel exponent refinement
  (pythagorean_team_win_pct). The Monte Carlo scheduling/bracket
  simulation architecture itself, and a third formula in this module
  (marcel_project_rate, a Marcel-style rate projection), are not
  independently cited or tied out here.
data_source: >
  core.game/raw.mlb_schedule via load_schedule_from_db() (schedule); falls
  back to generate_balanced_schedule() if no schedule is found.
  core.game.home_score/away_score via team_strength_asof() (real per-team
  runs-scored/runs-allowed, added 2026-09-23 -- see notes).
grain: season, per-team win/loss distribution and postseason-berth probability
layer: model
complexity: complex
implementation: python
status: published
visibility: internal
notes: >
  Fixed 2026-09-23 (metric-catalog triage follow-up): `mlb season-sim`'s CLI
  invocation used to pass a placeholder `team_true_talents` dict (every team
  fixed at 0.500), so its default output never produced differentiated team
  projections even though two of the module's formulas were already real
  and cited. `team_strength_asof()` now computes each team's real
  true-talent win percentage from that team's own real
  `core.game.home_score`/`away_score` up to a caller-specified point-in-time
  cutoff (`--as-of`, strict `game_date < as_of`, so the cutoff's own games
  never leak in), fed through the already-cited `pythagorean_team_win_pct()`
  -- `cli.py`'s `season-sim` handler now calls this instead of the flat
  0.500 dict. A team with zero qualifying games before the cutoff still
  gets 0.500, but as an explicit, logged fallback, not a silent default
  that looks like real computed talent.

  `status` promoted to `published`: the CLI's default real-world path now
  actually executes a real, cited formula (Pythagorean) against real data,
  correctly implemented (integration-tested with real differentiated
  run/win-pct data and a no-lookahead check), not yet independently
  tie-out tested against a specific known published team's real strength
  (hence not `validated`). `visibility` stays `internal`: this entry still
  bundles the uncited Monte Carlo orchestration and `marcel_project_rate`
  under one catalog record with the now-more-real Pythagorean/Log5 usage,
  and per this catalog's own prior reasoning here, splitting Log5 and
  Pythagorean into their own standalone `public` entries (unchanged
  suggestion from before this fix) is the right way to make those two
  formulas visible without overclaiming the whole bundled module.

  health_check() still only asserts the 30-team division mapping and a
  Pythagorean sanity value (4.5 RS/RA -> exactly 0.500), not anything about
  team_strength_asof() or the simulation's own output distribution --
  real-Postgres integration tests cover that instead (test_model_season.py).
