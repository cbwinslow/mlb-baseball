name: skill_aging_projection_engine
definition: >
  A standalone calculator (run via `mlb aging` on the command line) that
  projects a player's fastball velocity, sprint speed, and primary rate
  stat (wOBA for batters, FIP for pitchers) 1-3 years forward from an
  age and set of current-season numbers the USER types in, using a
  hand-written step-function "aging curve" keyed only on age. It does not
  read any of this project's own player or performance data, and is not
  part of any database build.
formula: mlb_baseball/model/aging.py::SkillAgingProjectionEngine.project_multi_year_trajectory
citation: project-derived (no external formula cited)
data_source: none -- takes only CLI-supplied numbers (mlb_baseball/cli.py "aging" command), never reads gold/core/raw
grain: not applicable (stateless per-call calculation, no stored grain)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The module's own docstring and ADR-145 (docs/DECISIONS.md) both use
  research-sounding language -- "Non-Linear Delta-Method Aging Slopes,"
  "Multi-Year Bayesian Career Forecasting" -- that does not match what the
  code does. The real "delta method" (Tom Tango) derives an aging curve
  empirically, by measuring year-over-year performance deltas for actual
  players who played in adjacent seasons and weighting by playing time.
  This module does none of that: `_get_annual_velocity_delta`,
  `_get_annual_sprint_delta`, `_get_annual_hitter_woba_delta`, and
  `_get_annual_pitcher_fip_delta` are plain age-bracket if/elif ladders
  returning hand-typed constants (e.g. pitcher FIP delta = -0.15 below age
  25, 0.00 age 25-27, +0.12 age 27-31, +0.25 above 31) with no citation, no
  derivation from this project's own data, and no reference to any published
  aging-curve research (checked docs/RESEARCH.md and docs/DECISIONS.md
  directly -- ADR-145 has no Citations section at all, unlike e.g. ADR-097
  for pitcher command). "Bayesian" likewise does not describe anything in
  the code -- there is no prior, no posterior, no uncertainty estimate,
  just a deterministic running sum of fixed deltas.

  Same disconnected-from-real-data pattern as bullpen_leverage_volatility_engine
  (see that entry): `mlb aging --age 28 --is-pitcher --velo 96.0` is wired
  into cli.py as a standalone command that builds a `PlayerTalentBaseline`
  entirely from CLI flags (defaults for anything not passed), never touches
  the database, and is not part of report.py's gold-table build pipeline.

  tests/unit/test_aging.py checks only that the hardcoded step function
  moves in the expected direction (pitcher velo/FIP worsen after 27, young
  batter's wOBA improves) -- self-consistency of the invented curve's shape,
  not a tie-out against any independently published aging-curve value.

  `status: implemented-untested` and `visibility: internal` reflect this
  honestly. Recommended follow-up: either implement a real delta-method
  curve from this project's own historical player data (there is real,
  citable public methodology to follow -- e.g. Tango's delta method or Jeff
  Zimmerman's more recent published aging-curve work) or archive this as a
  what-if calculator; out of scope for this batch to decide.
