name: slash_oppo_engine
definition: >
  A standalone all-fields-spray calculator that turns user-supplied
  opposite-field contact rate, opposite-field line-drive rate and pull-
  groundball rate into an Opposite Field Slash Resilience Rating (OFSRR), an
  assumed anti-shift BABIP gain, and an estimated runs value.
formula: mlb_baseball/model/slash_oppo.py::BatterSlashOppoEngine.evaluate_slash
citation: >
  project-derived. Shift-era BABIP effects are widely discussed, but no
  published source defines OFSRR or its constants: the 24.0% / 20.0% / 64.0%
  benchmarks, point weights (2.6/2.2/1.4), 0.00065 BABIP per point and 0.45
  runs multiplier are this project's own uncited choices.
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-batter calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Four unit tests (tests/unit/test_slash_oppo.py) on hand-picked inputs, not
  an external benchmark.
