name: spray_direction_engine
definition: >
  A standalone calculator (run via `mlb spray` on the command line) that
  takes a batter's pull/center/opposite-field batted-ball percentages and
  home-run counts -- all typed in by the user, not computed from data -- and
  derives what share of home runs were pulled, a "spray neutrality" score
  measuring how evenly contact is spread across the field, and a directional
  label like "Dead Pull Slugger". It does not read any of this project's own
  batted-ball data, and is not part of any database build.
formula: mlb_baseball/model/spray.py::SprayDirectionEngine.evaluate_spray
citation: >
  project-derived. Pull Power Concentration (share of home runs hit to the
  pull side, HR_pull / HR_total) is a simple, self-evident ratio with no
  real citation needed beyond arithmetic. The Spray Neutrality Index
  (1.0 minus a scaled Euclidean distance of the pull/center/oppo split from
  a perfectly even 1/3-1/3-1/3 split) is a project-invented formula --
  the 2.2 scaling constant that maps distance-from-uniform onto a 0-1 score
  is not derived from or cited to any published source.
data_source: >
  none -- takes only CLI-supplied numbers (mlb_baseball/cli.py "spray"
  command), never reads gold/core/raw.
grain: not applicable (stateless per-call calculation, no stored grain)
layer: model
complexity: arithmetic
implementation: python
status: implemented-untested
visibility: internal
notes: >
  FLAGGED FOR TRIAGE -- same class of finding as bullpen_leverage_volatility_
  engine, xslg_power_engine, and sweetspot_contact_engine. Unlike those two,
  the pull_pct/center_pct/oppo_pct/hr_pull/hr_total inputs here are also
  plain constructor fields (CLI flags or the dataclass's own placeholder
  defaults) -- the module computes only pull_power_concentration_pct (a
  correctly-implemented, trivially verifiable ratio matching docs/
  DECISIONS.md ADR-163's own math), spray_neutrality_index (the uncited 2.2
  constant), the dead-pull-liability flag, and the archetype label.

  The code never queries the database (no `conn` parameter anywhere), and
  `mlb spray` is wired into cli.py as a standalone command, not into any
  gold-table build pipeline. This is unrelated to shift.py's real
  batted-ball spray-suppression defensive alignment logic or any other
  "spray"-named visualizer module (e.g. visual.py's spray charts) elsewhere
  in this namespace -- do not confuse by the shared word.

  ADR-163's own "Verification" line is "3/3 unit tests in
  tests/unit/test_spray.py passing" -- its own unit tests, not an
  independent check. Both tests only assert that hand-picked example inputs
  (already heavily pull-side, or already perfectly balanced) land in the
  archetype the code was written to put them in -- self-consistency, not a
  tie-out against any real batter's actual spray outcomes.
  `status: implemented-untested` and `visibility: internal` reflect this
  honestly.
