name: starter_tto_penalty
definition: >
  A standalone calculator (run via `mlb tto` on the command line) that takes
  a starting pitcher's wOBA and strikeout rate for the 1st, 2nd, and 3rd
  time through the batting order -- numbers the USER types in -- and turns
  the 3rd-vs-1st-time gap into a 0-100 "Third-Time Vulnerability Index"
  (TTVI) and a managerial hook recommendation. It does not compute any
  times-through-the-order split from this project's own ingested
  play-by-play or box-score data, and is not part of any database build.
formula: mlb_baseball/model/tto.py::TimesThroughOrderEngine.evaluate_tto
citation: >
  project-derived. The general "times through the order" performance
  degradation phenomenon is a well-established, independently published
  sabermetric finding (e.g. Baseball Prospectus/FanGraphs research showing
  starter wOBA allowed rising and strikeout rate falling by the third time
  facing a lineup). This module's specific TTVI weighting and hook-policy
  thresholds, however, are not drawn from any cited published formula.
data_source: >
  none -- takes only CLI-supplied numbers (mlb_baseball/cli.py "tto"
  command: --tto1-woba/--tto2-woba/--tto3-woba/--tto1-k/--tto3-k) or the
  PitcherTTOMetrics dataclass's hardcoded defaults. It does not compute a
  real TTO split from this project's own ingested data (e.g.
  raw.retrosheet_event or raw.mlb_boxscore_pitching), and no connector or
  SQL asset in this repository currently derives real per-pitcher
  times-through-the-order splits at all.
grain: not applicable (stateless per-call calculation, no stored grain)
layer: model
complexity: arithmetic
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Unlike the published TTO research it cites in spirit, this module never
  measures a real split -- the caller must already know (or guess) a
  pitcher's tto1/tto2/tto3 wOBA and K% and hand-enter them. There is no
  upstream code anywhere in this project that computes those three numbers
  from real plate-appearance sequencing, so this module could not currently
  be pointed at real data without new ingestion/aggregation work.

  TTVI = clip(max(0, delta_woba/0.040)*40.0 + max(0, -delta_k)*160.0, 0, 100).
  The comments label 0.040/0.050 as "league average" wOBA/K% deltas, but no
  citation backs those specific figures, and the 40.0/160.0 scaling weights
  and the 62.0/35.0 hook-policy thresholds (STRICT_2_TIME_HOOK vs
  MODERATE_LEASH vs WORKHORSE_ACE) are uncited, hand-chosen values.

  tests/unit/test_tto.py's two scenario tests and health_check() all feed
  hand-picked synthetic PitcherTTOMetrics through the same formula being
  tested and assert tier-label/threshold self-consistency -- correct
  self-consistency proof, not an independent tie-out against a real
  pitcher's actual observed TTO split.

  Same class of issue as bullpen_leverage_volatility_engine.yaml: a
  standalone CLI what-if calculator, not a pipeline that reads or computes
  from this project's own data.
