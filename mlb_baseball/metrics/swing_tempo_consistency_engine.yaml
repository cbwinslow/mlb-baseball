name: swing_tempo_consistency_engine
definition: >
  A standalone swing-consistency calculator that turns user-supplied swing-
  timing standard deviation (ms), bat-speed consistency, and late-count
  contact rate into a Swing Tempo Consistency Index (STCI) and an estimated
  late-swing-adaptation runs value.
formula: mlb_baseball/model/swing_tempo.py::BatterSwingTempoEngine.evaluate_tempo
citation: >
  The module docstring lists three references (Nathan 2015 in the American
  Journal of Physics; Szymborski 2019 on Statcast bat tracking at FanGraphs;
  Lichtman 2014 at The Hardball Times). None was verified here, and the 2019
  Statcast bat-tracking reference looks anachronistic because, to my
  knowledge, public Statcast bat-tracking data only began in 2024. No
  reference is tied to the STCI formula, so treat it as project-derived.
data_source: "none -- caller-supplied dataclass fields; no gold/core/raw read"
grain: not applicable (stateless per-batter calculation)
layer: model
complexity: complex
implementation: python
status: implemented-untested
visibility: internal
notes: >
  The 3.5 ms / 90.0% / 75.0% benchmarks, point weights (5.0/1.2/0.6) and the
  0.0018 runs-per-swing conversion are this project's own uncited choices.
  avg_bat_speed_mph is a dataclass field that the calculation never reads.
  Three unit tests (tests/unit/test_swing_tempo.py) cover an elite-tempo
  case, an erratic swinger, and health_check on hand-picked inputs.
