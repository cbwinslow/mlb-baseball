name: velo_delta_disruption_engine
definition: >
  A standalone calculator (run via `mlb velo-delta` on the command line)
  that takes a pitcher's fastball and changeup velocities and induced
  vertical breaks as hand-typed inputs and produces the fastball-changeup
  velocity gap, the fastball-changeup movement gap, an invented 0-160
  "Velocity Delta Disruption Index" score, a whiff-rate multiplier, and an
  archetype label (e.g. "ELITE_VELO_BAND_DISRUPTOR"). It does not read this
  project's own ingested Statcast pitch data, and is not part of any
  database build.
formula: mlb_baseball/model/velo_delta.py::PitcherVeloDeltaEngine.evaluate_separation
citation: project-derived (no external formula cited)
data_source: >
  none. mlb_baseball/cli.py's "velo-delta" command only lets the user set
  --fb-velo, --ch-velo, --sl-velo, --cb-velo, --fb-ivb, --ch-ivb (all
  CLI-typed dataclass fields on PitcherArsenalSeparationMetrics); none of
  them is ever read from raw.statcast_pitch, the table this project's own
  Statcast connector (mlb_baseball/connectors/statcast.py) actually
  populates with real per-pitch velocity/movement measurements.
grain: not applicable (stateless per-call calculation, no stored grain)
layer: model
complexity: arithmetic
implementation: python
status: implemented-untested
visibility: internal
notes: >
  Same disconnected-CLI-toy pattern as spin_decomposition_engine.yaml and
  this batch's vaa_toz_deception_engine.yaml: wired into `mlb_baseball/cli.py`
  (the `velo-delta` subcommand, ~line 6861) and `doctor.py`'s health-check
  aggregation, never into `report.py` / `gold.game_feature` / the real build
  pipeline. `health_check()` only re-runs the class against two hardcoded
  fixture pitchers and checks their tier labels.

  Checked docs/DECISIONS.md ADR-200 directly: it restates the identical
  formula (Delta v = v_FB - v_CH, Delta IVB = IVB_FB - IVB_CH, VDDI = 100 +
  (Dv-8.5)*3.8 + (DIVB-10.0)*2.8 + (v_FB-93.5)*1.8, whiff multiplier =
  1 + max(0, VDDI-100)/300, tier thresholds 115.0/9.5/98.0/6.0/85.0/4.5) with
  no author, no paper, no external source cited for any of the coefficients.
  Checked docs/RESEARCH.md's citation catalog directly -- no VELO-DELTA-01 /
  Package 112 entry exists there either. The 3.8/2.8/1.8 sensitivity
  coefficients and every tier threshold read as hand-picked plausible
  numbers, not a fitted or published model.

  IMPORTANT -- this is NOT the "Velocity Delta" already cataloged in
  pitcher_command_attack_zones.yaml: that entry covers command.py's real,
  database-integrated, point-in-time `home/away_starter_velo_delta` /
  `home/away_bullpen_velo_delta` columns in gold.game_feature (fastball
  velocity minus a broader off-speed-arsenal average across CH/FS/SL/CU/
  ST/SV, fed into gbm.py's FEATURE_COLUMNS and experiment.py). This module
  (velo_delta.py) is a completely separate, disconnected file: it computes
  fastball-MINUS-CHANGEUP specifically (not a broad off-speed average),
  never touches the database, and adds its own invented "VDDI"
  disruption-index scoring and archetype tiers on top -- confirmed by
  grepping the whole package for `velo_delta` usage: command.py's columns
  are referenced from gbm.py/experiment.py's FEATURE_COLUMNS, while this
  module's PitcherVeloDeltaEngine is referenced only from cli.py's
  `velo-delta` subcommand and doctor.py's health check, no overlap in code
  path. (The task brief that prompted this batch guessed this module might
  be a start-to-start or inning-to-inning velocity-decline metric for the
  same pitch type -- verified false by direct code read: it is a
  same-game, cross-pitch-type fastball-vs-changeup gap, not a decline-over-
  time metric.) Named `velo_delta_disruption_engine` here (matching the
  class's own "Disruption Engine" language) specifically so it cannot be
  confused with the `pitcher_command_attack_zones` entry's velo_delta
  columns in the catalog index.

  tests/unit/test_velo_delta.py's tests assert tier-label output for two
  hand-picked archetype fixtures, plus one test
  (test_default_metrics_match_adr200_vddi_formula) that hand-derives the
  VDDI score for the class's own default inputs (104.1) and pins it against
  ADR-200's formula text -- self-consistent proof the arithmetic matches
  what the code and its own ADR say, not any external validation of the
  underlying model or its coefficients.
