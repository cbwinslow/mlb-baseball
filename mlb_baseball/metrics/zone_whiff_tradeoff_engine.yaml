name: zone_whiff_tradeoff_engine
definition: >
  A standalone calculator (run via `mlb zone-whiff` on the command line) that
  takes a batter's already-computed in-zone swing rate, in-zone whiff rate,
  and in-zone barrel rate (hand-typed on the command line, not counted from
  real pitch data) and blends them into one invented composite score
  ("ZCPOI") plus a rough runs-saved estimate ("IZPSR"), then labels the
  batter into one of four made-up archetype tiers. It does not read any of
  this project's own pitch-tracking data, and is not part of any database
  build.
formula: mlb_baseball/model/zone_whiff.py::BatterZoneWhiffEngine.evaluate_zone_whiff
citation: project-derived (no external formula cited)
data_source: none -- takes only hand-entered BatterZoneWhiffMetrics inputs (mlb_baseball/cli.py "zone-whiff" command, or hardcoded examples in health_check()), never reads gold/core/raw
grain: not applicable (stateless per-call calculation, no stored grain)
layer: model
complexity: arithmetic
implementation: python
status: implemented-untested
visibility: internal
notes: >
  IMPORTANT MISMATCH between what the module's own name/ADR tag
  (ZONE-WHIFF-01) implies and what it actually computes: real "zone whiff%"
  is a simple, well-understood public statistic (swinging strikes divided by
  swings taken at pitches inside the strike zone), directly countable from
  pitch-level tracking data. This module does NOT compute that. It never
  counts a single pitch, swing, or whiff -- BatterZoneWhiffMetrics takes
  zone_swing_rate_pct/zone_whiff_rate_pct/zone_barrel_per_bbe_pct as
  already-aggregated hand-typed percentages (each with an unsourced default
  "benchmark" -- 68.0% swing, 16.0% whiff, 9.5% barrel -- that read like
  plausible league-average-ish numbers but are not cited to any source), and
  combines them with uncited linear weights (whiff_bonus * 2.8, barrel_bonus
  * 3.2, swing_bonus * 0.9) into an invented "ZCPOI" index and an invented
  "~0.0024 runs per swing per index point above 100" conversion into
  "IZPSR" runs. So this entry is named for what the code actually is (a
  contact/power tradeoff scoring engine), not "zone_whiff", to avoid
  implying it reproduces the real, standard zone-whiff% statistic.

  Confirmed by direct grep: the only callers of BatterZoneWhiffMetrics are
  `mlb zone-whiff` (cli.py, hand-typed --z-swing/--z-whiff/--z-barrel/--swings
  flags) and the module's own health_check() (two hardcoded example
  batters) -- never a real ingested batter's pitch-level data. Same class of
  finding already caught for win_probability_added_calculator.yaml and
  bullpen_leverage_volatility_engine.yaml: a standalone hand-entered CLI
  calculator disconnected from this project's own database build.

  The tier thresholds (e.g. ZCPOI >= 118.0 and barrel% >= 12.5 and whiff% <=
  14.0 for "ELITE_ZONE_CRUSHER_MASTER") are also uncited project-chosen
  cutoffs.

  tests/unit/test_zone_whiff.py checks that hand-picked synthetic batter
  inputs land in the tier the test author intended (a high-barrel/low-whiff
  profile classifies as "ELITE_ZONE_CRUSHER_MASTER", a low-whiff/low-barrel
  profile as "EMPTY_CONTACT_ZONE_SLAPPER") -- self-consistency checks against
  the module's own thresholds, not a tie-out against any independently
  published or measured value for a real batter. `status:
  implemented-untested` reflects that no independent check exists.
