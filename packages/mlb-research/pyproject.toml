[project]
name = "mlb-research"
version = "0.1.0"
description = "pybaseball-style Python loader for the MLB Research Statistic Backbone dataset."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "huggingface_hub>=0.24",
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# scikit-learn tie-out tests only (mlb_research.backtest itself never imports
# sklearn/xgboost at runtime -- see test_module_imports_without_sklearn_or_xgboost).
dev = [
    "scikit-learn>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlb_research"]
