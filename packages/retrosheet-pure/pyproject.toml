[project]
name = "retrosheet-pure"
version = "0.0.1"
description = "Pure-Python Retrosheet file client and lossless record/play parser (no native tools required)."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrosheet_pure"]
