[project]
name = "retrosheetpy"
version = "0.0.1"
description = "Pure-Python Retrosheet file client and lossless record/play parser (no native tools required)."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
# Named like Chadwick's tools with a "-py" suffix so that they do not shadow the C programs
cwevent-py = "retrosheetpy.cw.cli:main_cwevent"
cwgame-py = "retrosheetpy.cw.cli:main_cwgame"
cwdaily-py = "retrosheetpy.cw.cli:main_cwdaily"
cwsub-py = "retrosheetpy.cw.cli:main_cwsub"
cwcomment-py = "retrosheetpy.cw.cli:main_cwcomment"
cwbox-py = "retrosheetpy.cw.cli:main_cwbox"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrosheetpy"]
