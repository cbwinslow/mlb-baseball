[project]
name = "mlb-baseball"
version = "0.1.0"
description = "MLB data ingestion pipeline, ML modeling, and an oddstrader-style Astro site."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pandas>=2.0",
    "pybaseball>=2.2",
    "MLB-StatsAPI>=1.7",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "feedparser>=6.0.14",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=4.6",
    "sqlmesh[postgres]>=0.236.1",
    "sqlfluff>=3.0",
    "pytest-postgresql>=8.1,<9",
]

[project.scripts]
mlb = "mlb_baseball.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlb_baseball"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "migrations"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# host/user for pytest-postgresql's postgresql_noproc fixture are resolved
# in tests/conftest.py (falling back to "localhost" / getpass.getuser()),
# not hardcoded here -- a hardcoded postgresql_user would be one specific
# contributor's OS username, which breaks for everyone else.

[tool.mypy]
files = ["mlb_baseball"]
# Third-party baseball/data libraries (pybaseball, statsapi, xgboost, ...)
# ship no type stubs — don't fail on their absence, check our own code.
ignore_missing_imports = true
